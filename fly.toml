app = "tab402"
primary_region = "iad"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  # Settlement ledger lives on the volume below, not the ephemeral rootfs.
  DATA_DIR = "/data"

# Persists the settlement history across deploys and idle auto-stops.
# Create once before deploying:  fly volumes create tab402_data --size 1 --region iad
[[mounts]]
  source = "tab402_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
