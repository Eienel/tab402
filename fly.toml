app = "tab402"
primary_region = "iad"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Optional: persist the settlement history across deploys and idle auto-stops.
# The rootfs is ephemeral, so without this the dashboard feed empties on restart
# (the payments themselves are unaffected; they live on Casper).
#
# Deploying with a mount whose volume does not exist FAILS, so create it first:
#   fly volumes create tab402_data --size 1 --region iad
# The "Deploy to Fly" GitHub Action in this repo does that for you.
# Then uncomment all four lines below and redeploy.
#
# [env]
#   DATA_DIR = "/data"
#
# [[mounts]]
#   source = "tab402_data"
#   destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
