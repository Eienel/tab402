app = "tab402"
primary_region = "iad"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  # Settlement ledger lives on the volume below, not the ephemeral rootfs, so
  # the dashboard's history survives deploys and idle auto-stops.
  DATA_DIR = "/data"

# Deploying against a mount whose volume does not exist FAILS. The "Deploy to
# Fly" GitHub Action creates it automatically before deploying. If you deploy
# some other way, create it once first:
#   fly volumes create tab402_data --size 1 --region iad
[[mounts]]
  source = "tab402_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
